<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Home</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="renewal-panel.css">
</head>
<body>
  <!-- Wallpaper: two layers so photos crossfade, then scrims that keep text readable. -->
  <div id="wallA" class="wall"></div>
  <div id="wallB" class="wall"></div>
  <div id="scrim"></div>

  <header>
    <div id="timeBlock">
      <div id="clock"></div>
      <div id="date"></div>
    </div>
    <div id="topButtons">
      <div class="roundBtn glass" id="btnInputs">
        <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v4h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM1 17v2h2c0-1.1-.9-2-2-2zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11z"/></svg>
        <span class="btnLabel">Inputs</span>
      </div>
      <div class="roundBtn glass" id="btnSettings">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
        <span class="btnLabel">Settings</span>
      </div>
      <div class="roundBtn glass" id="btnSearch">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <span class="btnLabel">Search</span>
      </div>
      <div class="roundBtn glass hidden" id="btnResumeHome" role="button" aria-label="Enable Home control">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span class="btnLabel">Resume Home</span>
      </div>
    </div>
  </header>

  <div id="dock">
    <div id="tiles"></div>
    <div id="emptyHint" class="hidden">No apps here yet. Open <b>+</b> and hold OK on an app to add it.</div>
  </div>

  <nav id="tabBar"></nav>

  <div id="caption"></div>

  <!-- Dropdown under the Inputs button. -->
  <div id="inputsPanel" class="glass hidden"></div>

  <!-- "+": every app; OK opens, hold OK adds to or removes from the current tab. -->
  <section id="allPanel" class="hidden">
    <div id="allSheet" class="glass">
      <div id="allTitle"></div>
      <div id="allGrid"></div>
    </div>
  </section>

  <div id="toast" class="glass"></div>

  <script src="config.js"></script>
  <script src="apps.js"></script>
  <script src="user-data.js"></script>
  <script src="wallpaper.js"></script>
  <script src="update-panel.js"></script>
  <script src="renewal-panel.js"></script>
  <script src="profile-bootstrap.js"></script>
  <script src="native-bootstrap.js"></script>
  <script src="helper-control.js"></script>
</body>
</html>
